[package]
name = "puavo-kpsd"
version.workspace = true
edition.workspace = true

[[bin]]
name = "puavo-kpsd"
path = "src/main.rs"

[dependencies]
# Internal crates
puavo-hsm = { path = "../puavo-hsm" }

# CLI and configuration
clap = { version = "4.5", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true

puavo-ipc = { path = "../puavo-ipc" }
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
async-trait = "0.1"
bincode = "1.3"
anyhow = "1.0"
toml.workspace = true
nix = { version = "0.29", features = ["user", "fs"] }
libc = "0.2"
zeroize.workspace = true

# Cryptography
cryptoki.workspace = true
hex.workspace = true
openssl.workspace = true
r2d2 = "0.8.10"

# Image and QR code decoding
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
rxing = { version = "0.9.0", default-features = false, features = ["qrcode", "image", "encoding_rs", "multi_barcode_readers"] }

[dev-dependencies]
tempfile = "3.14"
# QR code generation for recovery bundle decoding tests
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
