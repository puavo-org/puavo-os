[package]
name = "puavo-boot-trust-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
libcryptsetup-rs = "0.13.2"
loopdev-3 = "0.5.2"
nix = "0.30.1"
tempfile = "3.21.0"
thiserror = "2.0.16"
udev = "0.9.3"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"
sha2 = "0.10.9"

[profile.release]
strip = true
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
