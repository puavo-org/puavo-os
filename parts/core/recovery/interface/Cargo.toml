[workspace]
resolver = "3"
members = ["crates/flow", "crates/interface", "crates/services"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-2.0-or-later"

[workspace.dependencies]
recovery-flow = { path = "crates/flow" }
recovery-services = { path = "crates/services" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The tests make RSA keys, which takes minutes without optimisation.
[profile.dev.package."*"]
opt-level = 2
