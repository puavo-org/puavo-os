[package]
name = "puavo-kps"
version.workspace = true
edition.workspace = true

[[bin]]
name = "puavo-kps"
path = "src/main.rs"

[dependencies]
# Internal crates
puavo-ipc = { path = "../puavo-ipc" }
puavo-kpsd = { path = "../puavo-kpsd" }

# CLI and configuration
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

# Error handling and logging
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-subscriber.features = ["env-filter"]

# System interaction
nix.workspace = true

# Async runtime and IPC
tokio = { version = "1.43", features = ["full"] }
bincode = "1.3"
async-trait = "0.1"

# Cryptography (for device-local recovery bundle generation)
hex.workspace = true
rand.workspace = true
rsa = { workspace = true, features = ["pem"] }

[dev-dependencies]
