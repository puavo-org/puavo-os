[Service]
# Sometimes udev misses the swap signature and never marks the device
# ready (SYSTEMD_READY=0), so the boot waits for the swap forever.
# Give it a little push and trigger it manually.
ExecStartPost=-/bin/sh -c 'case "%I" in cryptswap*) exec timeout 30 udevadm trigger --settle --action=change "/dev/mapper/%I" ;; esac'
